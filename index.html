<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DQMJ1 — Calculateur de Fusion</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #16213e;
      --accent: #e8b84b;
      --accent2: #4b7be8;
      --text: #e8e8f0;
      --text2: #9090b0;
      --border: #2a2a4a;
      --tag-slime: #4fc3f7;
      --tag-dragon: #ef5350;
      --tag-nature: #66bb6a;
      --tag-beast: #ffa726;
      --tag-material: #ab47bc;
      --tag-demon: #ec407a;
      --tag-undead: #78909c;
      --tag-incarni: #ffd54f;
      --rank-f: #78909c;
      --rank-e: #66bb6a;
      --rank-d: #4fc3f7;
      --rank-c: #ffa726;
      --rank-b: #ef5350;
      --rank-a: #ec407a;
      --rank-s: #ffd54f;
      --rank-x: #e040fb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 {
      font-size: 1.4rem;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    header span {
      color: var(--text2);
      font-size: 0.85rem;
    }

    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }

    .tab {
      padding: 12px 20px;
      cursor: pointer;
      color: var(--text2);
      font-size: 0.9rem;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }

    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .page { display: none; padding: 24px; max-width: 960px; margin: 0 auto; }
    .page.active { display: block; }

    /* ---- FUSION CALCULATOR ---- */
    .fusion-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: start;
    }

    .parent-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .parent-card h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text2);
      margin-bottom: 12px;
    }

    .search-wrap { position: relative; }

    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus { border-color: var(--accent2); }

    .dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }

    .dropdown.open { display: block; }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      cursor: pointer;
      transition: background 0.1s;
      font-size: 0.9rem;
    }

    .dropdown-item:hover { background: var(--border); }

    .monster-preview {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-height: 120px;
    }

    .sprite-box {
      width: 80px; height: 80px;
      background: var(--bg);
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .sprite-box img {
      max-width: 72px;
      max-height: 72px;
      image-rendering: pixelated;
    }

    .sprite-box .no-sprite {
      font-size: 2rem;
    }

    .monster-name {
      font-weight: 600;
      font-size: 1rem;
      text-align: center;
    }

    .badge-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .arrow-col {
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 60px;
    }

    .arrow-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 50%;
      width: 44px; height: 44px;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      transition: transform 0.1s, opacity 0.1s;
    }

    .arrow-btn:hover { transform: scale(1.1); }
    .arrow-btn:disabled { opacity: 0.3; cursor: default; transform: none; }

    .result-section { margin-top: 28px; }

    .result-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text2);
      margin-bottom: 12px;
    }

    .result-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .result-card:hover { border-color: var(--accent2); }
    .result-card.generic { border-style: dashed; }

    .result-card .type-label {
      font-size: 0.7rem;
      color: var(--text2);
      text-transform: uppercase;
    }

    .empty-state {
      text-align: center;
      color: var(--text2);
      padding: 40px;
      font-size: 0.95rem;
    }

    /* ---- REVERSE LOOKUP ---- */
    .reverse-input-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .reverse-input-wrap h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text2);
      margin-bottom: 12px;
    }

    .combos-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .combo-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      flex-wrap: wrap;
    }

    .combo-row .combo-type {
      font-size: 0.7rem;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .combo-part {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.1s;
    }

    .combo-part:hover { background: var(--border); }

    .combo-plus {
      color: var(--text2);
      font-weight: 700;
    }

    /* ---- MONSTER LIST ---- */
    .monster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }

    .monster-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: border-color 0.15s;
      font-size: 0.85rem;
    }

    .monster-tile:hover { border-color: var(--accent2); }

    .monster-tile .id { color: var(--text2); font-size: 0.75rem; }
    .monster-tile .name { font-weight: 600; text-align: center; }

    /* ---- BADGES COLOR ---- */
    .fam-Slime { background: #4fc3f720; color: var(--tag-slime); }
    .fam-Dragon { background: #ef535020; color: var(--tag-dragon); }
    .fam-Nature { background: #66bb6a20; color: var(--tag-nature); }
    .fam-Beast { background: #ffa72620; color: var(--tag-beast); }
    .fam-Material { background: #ab47bc20; color: var(--tag-material); }
    .fam-Demon { background: #ec407a20; color: var(--tag-demon); }
    .fam-Undead { background: #78909c20; color: var(--tag-undead); }
    .fam-Incarni { background: #ffd54f20; color: var(--tag-incarni); }

    .rank-F { background: #78909c20; color: var(--rank-f); }
    .rank-E { background: #66bb6a20; color: var(--rank-e); }
    .rank-D { background: #4fc3f720; color: var(--rank-d); }
    .rank-C { background: #ffa72620; color: var(--rank-c); }
    .rank-B { background: #ef535020; color: var(--rank-b); }
    .rank-A { background: #ec407a20; color: var(--rank-a); }
    .rank-S { background: #ffd54f20; color: var(--rank-s); }
    .rank-X { background: #e040fb20; color: var(--rank-x); }
    .rank-none { background: #2a2a4a; color: var(--text2); }

    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.15s;
    }

    .filter-btn:hover { color: var(--text); border-color: var(--text2); }
    .filter-btn.active { color: #000; background: var(--accent); border-color: var(--accent); }

    .search-bar-full {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 16px;
    }

    .search-bar-full:focus { border-color: var(--accent2); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @media (max-width: 600px) {
      .fusion-grid { grid-template-columns: 1fr; }
      .arrow-col { padding-top: 0; transform: rotate(90deg); }
    }
  </style>
</head>

<header>

    <span>Dragon Quest Monsters: Joker — données GameFAQs/Dragon Quest Wiki</span>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('fusion')">Calculateur</div>
  <div class="tab" onclick="switchTab('reverse')">Recherche inverse</div>
  <div class="tab" onclick="switchTab('list')">Tous les monstres</div>
</div>

<div id="fusion" class="page active">
  <div class="fusion-grid">
    <div class="parent-card">
      <h3>Parent A</h3>
      <div class="search-wrap">
        <input class="search-input" id="searchA" placeholder="Chercher un monstre…" oninput="filterDropdown('A')" onfocus="openDropdown('A')" onblur="closeDropdown('A')" autocomplete="off" />
        <div class="dropdown" id="dropA"></div>
      </div>
      <div class="monster-preview" id="previewA">
        <div class="sprite-box"><span class="no-sprite">?</span></div>
        <span class="monster-name" style="color:var(--text2)">Aucun monstre sélectionné</span>
      </div>
    </div>

    <div class="arrow-col">
      <button class="arrow-btn" id="fuseBtn" onclick="computeFusion()" disabled>+</button>
    </div>

    <div class="parent-card">
      <h3>Parent B</h3>
      <div class="search-wrap">
        <input class="search-input" id="searchB" placeholder="Chercher un monstre…" oninput="filterDropdown('B')" onfocus="openDropdown('B')" onblur="closeDropdown('B')" autocomplete="off" />
        <div class="dropdown" id="dropB"></div>
      </div>
      <div class="monster-preview" id="previewB">
        <div class="sprite-box"><span class="no-sprite">?</span></div>
        <span class="monster-name" style="color:var(--text2)">Aucun monstre sélectionné</span>
      </div>
    </div>
  </div>

  <div class="result-section" id="fusionResult"></div>
</div>

<div id="reverse" class="page">
  <div class="reverse-input-wrap">
    <h3>Monstre cible</h3>
    <div class="search-wrap">
      <input class="search-input" id="searchTarget" placeholder="Quel monstre veux-tu obtenir ?" oninput="filterDropdown('T')" onfocus="openDropdown('T')" onblur="closeDropdown('T')" autocomplete="off" />
      <div class="dropdown" id="dropT"></div>
    </div>
  </div>
  <div id="reverseResult"></div>
</div>

<div id="list" class="page">
  <input class="search-bar-full" id="listSearch" placeholder="Filtrer par nom…" oninput="renderList()" />
  <div class="filter-bar" id="familyFilters"></div>
  <div class="monster-grid" id="monsterGrid"></div>
</div>

function spriteImg(monster, size=64) {
  const url = spriteUrl(monster.name);
  return `<img src="${url}" alt="${monster.name}" style="max-width:${size}px;max-height:${size}px;image-rendering:pixelated;" onerror="this.style.display='none';this.nextSibling.style.display='block'" /><span style="display:none;font-size:1.4rem">🐉</span>`;
}

function familyBadge(family) {
  return `<span class="badge fam-${family}">${family}</span>`;
}

function rankBadge(rank) {
  const cls = rank ? `rank-${rank}` : 'rank-none';
  return `<span class="badge ${cls}">Rank ${rank||'?'}</span>`;
}

  const q = input.value.toLowerCase().trim();
  const filtered = q.length === 0
    ? MONSTERS.slice(0,30)
    : MONSTERS.filter(m => m.name.toLowerCase().includes(q)).slice(0,40);

  drop.innerHTML = filtered.map(m =>
    `<div class="dropdown-item" onmousedown="selectMonster('${side}', ${m.id})">
      <div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;overflow:hidden;">
        ${spriteImg(m, 26)}
      </div>
      <span>${m.name}</span>
      <span class="badge fam-${m.family}" style="margin-left:auto;font-size:0.68rem;padding:1px 6px;">${m.family}</span>
      <span class="badge rank-${m.rank}" style="font-size:0.68rem;padding:1px 6px;">R${m.rank}</span>
    </div>`
  ).join('');
  drop.classList.add('open');
}

function openDropdown(side) {
  filterDropdown(side);
  document.getElementById(`drop${side}`).classList.add('open');
}

function closeDropdown(side) {
  setTimeout(() => {
    const drop = document.getElementById(`drop${side}`);
    if (drop) drop.classList.remove('open');
  }, 150);
}

function selectMonster(side, id) {
  const m = byId[id];
  if (side === 'A') {
    selectedA = m;
    document.getElementById('searchA').value = m.name;
    renderPreview('A', m);
  } else if (side === 'B') {
    selectedB = m;
    document.getElementById('searchB').value = m.name;
    renderPreview('B', m);
  } else if (side === 'T') {
    selectedTarget = m;
    document.getElementById('searchTarget').value = m.name;
    renderReverse();
  }
  document.getElementById(`drop${side}`).classList.remove('open');
  updateFuseBtn();
}

function renderPreview(side, m) {
  document.getElementById(`preview${side}`).innerHTML = `
    <div class="sprite-box">${spriteImg(m)}</div>
    <span class="monster-name">#${m.id} ${m.name}</span>
    <div class="badge-row">
      ${familyBadge(m.family)}
      ${rankBadge(m.rank)}
    </div>
  `;
}

function updateFuseBtn() {
  document.getElementById('fuseBtn').disabled = !(selectedA && selectedB);
  if (selectedA && selectedB) computeFusion();
}

// ============================================================
// FUSION LOGIC
// ============================================================
function computeFusion() {
  if (!selectedA || !selectedB) return;
  const a = selectedA, b = selectedB;

  const results = [];

  // 1. Check special/quad recipes where BOTH parents match
  MONSTERS.forEach(result => {
    const recipes = RECIPES[result.id];
    if (!recipes) return;
    recipes.forEach(recipe => {
      if (matchesRecipe(a, b, recipe) || matchesRecipe(b, a, recipe)) {
        results.push({monster: result, recipe, type: recipe.type});
      }
    });
  });

  // 2. Generic synthesis — if same family
  if (a.family === b.family && a.family !== 'Incarni') {
    const genericResults = genericSameFamilyResults(a, b);
    genericResults.forEach(r => {
      if (!results.find(x => x.monster.id === r.id)) {
        results.push({monster: r, type: 'generic', label: 'Synthèse générique (même famille)'});
      }
    });
  }

  // 3. Generic synthesis — different families
  if (a.family !== b.family && a.family !== 'Incarni' && b.family !== 'Incarni') {
    const thirdFam = GENERIC_THIRD[a.family]?.[b.family];
    const [r1, r2, r3] = genericDifferentFamilyResults(a, b);
    [r1, r2, r3].filter(Boolean).forEach((r, i) => {
      if (!results.find(x => x.monster.id === r.id)) {
        results.push({monster: r, type: 'generic', label: i === 2 ? `3e résultat (${thirdFam})` : ''});
      }
    });
  }

  renderFusionResult(results, a, b);
}

function matchesRecipe(a, b, recipe) {
  const [pA, pB] = recipe.parents;
  return matchesParent(a, pA) && matchesParent(b, pB);
}

function matchesParent(monster, spec) {
  if (spec.startsWith('family:')) {
    return monster.family === spec.replace('family:','');
  }
  return monster.name === spec || monster.name.toLowerCase() === spec.toLowerCase();
}

// Generic synthesis: same family → use monster IDs
function genericSameFamilyResults(a, b) {
  const highId = Math.max(a.id, b.id);
  const lowId = Math.min(a.id, b.id);
  const family = a.family;

  // Generic monsters of this family, sorted by ID
  const generics = MONSTERS.filter(m => m.family === family).sort((x,y) => x.id - y.id);

  const results = [];

  // Result 1: next generic monster above highId in same family
  const r1 = generics.find(m => m.id > highId);
  if (r1) results.push(r1);

  // Result 2: next generic monster above lowId (different from r1)
  const r2 = generics.find(m => m.id > lowId && m !== r1);
  if (r2 && r2.id !== (r1?.id)) results.push(r2);

  return results;
}

// Generic synthesis: different families
function genericDifferentFamilyResults(a, b) {
  const highId = Math.max(a.id, b.id);

  // Result 1: next generic of A's family above highId
  const famAGenerics = MONSTERS.filter(m => m.family === a.family).sort((x,y) => x.id - y.id);
  const famBGenerics = MONSTERS.filter(m => m.family === b.family).sort((x,y) => x.id - y.id);

  const r1 = famAGenerics.find(m => m.id > highId);
  const r2 = famBGenerics.find(m => m.id > highId);

  const thirdFam = GENERIC_THIRD[a.family]?.[b.family];
  const thirdGenerics = thirdFam ? MONSTERS.filter(m => m.family === thirdFam).sort((x,y) => x.id - y.id) : [];
  const r3 = thirdGenerics.find(m => m.id > highId);

  return [r1, r2, r3];
}

function renderFusionResult(results, a, b) {
  const section = document.getElementById('fusionResult');
  if (results.length === 0) {
    section.innerHTML = `
      <p class="result-title">Résultats possibles</p>
      <div class="empty-state">Aucun résultat trouvé pour cette combinaison.<br>Essaie d'autres monstres ou vérifie les rangs requis.</div>
    `;
    return;
  }

  const specials = results.filter(r => r.type !== 'generic');
  const generics = results.filter(r => r.type === 'generic');

  let html = '';

  if (specials.length > 0) {
    html += `<p class="result-title" style="margin-bottom:12px">✨ Résultats spéciaux / quadrilinéaux</p>
    <div class="result-cards">`;
    specials.forEach(r => {
      const typeLabel = r.type === 'quad' ? 'Quadrilinéal' : 'Spécial';
      const note = r.recipe?.note ? `<span style="font-size:0.72rem;color:var(--text2)">${r.recipe.note}</span>` : '';
      html += `
        <div class="result-card" onclick="selectMonster('A',${r.monster.id})">
          <div class="sprite-box" style="width:60px;height:60px">${spriteImg(r.monster, 54)}</div>
          <span class="monster-name">${r.monster.name}</span>
          <div class="badge-row">
            ${familyBadge(r.monster.family)}
            ${rankBadge(r.monster.rank)}
          </div>
          <span class="type-label">${typeLabel}</span>
          ${note}
        </div>`;
    });
    html += '</div>';
  }

  if (generics.length > 0) {
    html += `<p class="result-title" style="margin-top:24px;margin-bottom:12px">🎲 Résultats génériques possibles</p>
    <div class="result-cards">`;
    generics.forEach(r => {
      html += `
        <div class="result-card generic" onclick="selectMonster('A',${r.monster.id})">
          <div class="sprite-box" style="width:60px;height:60px">${spriteImg(r.monster, 54)}</div>
          <span class="monster-name">${r.monster.name}</span>
          <div class="badge-row">
            ${familyBadge(r.monster.family)}
            ${rankBadge(r.monster.rank)}
          </div>
          <span class="type-label">${r.label || 'Générique'}</span>
        </div>`;
    });
    html += '</div>';
    html += `<p style="color:var(--text2);font-size:0.8rem;margin-top:10px">⚠️ Les résultats génériques dépendent des IDs des parents. D'autres résultats sont possibles selon votre combinaison exacte.</p>`;
  }

  section.innerHTML = html;
}

// ============================================================
// REVERSE LOOKUP
// ============================================================
function renderReverse() {
  const target = selectedTarget;
  const section = document.getElementById('reverseResult');
  if (!target) { section.innerHTML = ''; return; }

  const combos = [];

  // Special/quad recipes
  const recipes = RECIPES[target.id];
  if (recipes) {
    recipes.forEach(r => {
      const [pA, pB] = r.parents;
      const quadParts = r.quad;
      combos.push({
        type: r.type === 'quad' ? 'Quadrilinéal' : 'Spécial',
        pA, pB, quad: quadParts, note: r.note
      });
    });
  }

  // Generic synthesis note
  const isGeneric = !recipes || recipes.length === 0 ||
    (MONSTERS.find(m=>m.id===target.id)?.rank &&
    ['F','E','D','C','B','A'].includes(MONSTERS.find(m=>m.id===target.id).rank));

  let html = `<div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;">
    <div class="sprite-box" style="width:80px;height:80px">${spriteImg(target,72)}</div>
    <div>
      <div style="font-size:1.2rem;font-weight:700">#${target.id} ${target.name}</div>
      <div class="badge-row" style="margin-top:8px">${familyBadge(target.family)} ${rankBadge(target.rank)}</div>
    </div>
  </div>`;

  if (combos.length === 0 && !isGenericMonster(target)) {
    html += `<div class="empty-state">Ce monstre ne peut pas être obtenu par synthèse.<br>Cherche-le dans la nature ou via des événements.</div>`;
    section.innerHTML = html;
    return;
  }

  if (combos.length > 0) {
    html += `<p class="result-title" style="margin-bottom:12px">Recettes connues</p>
    <div class="combos-list">`;
    combos.forEach(c => {
      const partA = renderComboParent(c.pA);
      const partB = renderComboParent(c.pB);
      let quadHtml = '';
      if (c.quad) {
        const qA = renderComboParent(c.quad[0]);
        const qB = renderComboParent(c.quad[1]);
        quadHtml = `<span style="color:var(--text2)">&&</span> ${qA} <span class="combo-plus">+</span> ${qB}`;
      }
      const noteHtml = c.note ? `<span style="color:var(--text2);font-size:0.78rem">(${c.note})</span>` : '';
      html += `
        <div class="combo-row">
          <span class="combo-type">${c.type}</span>
          ${partA}
          <span class="combo-plus">+</span>
          ${partB}
          ${quadHtml}
          ${noteHtml}
        </div>`;
    });
    html += '</div>';
  }

  if (isGenericMonster(target)) {
    html += `<div style="margin-top:${combos.length?'20px':'0'}">
      <p class="result-title" style="margin-bottom:8px">Synthèse générique</p>
      <div class="combo-row">
        <span class="combo-type">Générique</span>
        <span>Utilise deux monstres dont l'ID maximal est inférieur à <strong>#${target.id}</strong> et dont la famille correspond à <strong>${target.family}</strong>.</span>
      </div>
    </div>`;
  }

  section.innerHTML = html;
}

function isGenericMonster(m) {
  const genericFamilies = ['Slime','Dragon','Nature','Beast','Material','Demon','Undead'];
  if (!genericFamilies.includes(m.family)) return false;
  const familyGenerics = {
    Slime: [1,8,15,23,31,38,46,53,65,67,73,81,82,84,90,99,104,107,117,125,134,144,151,164,177,184,191],
    Dragon: [2,9,16,24,32,39,47,54,58,66,74,83,91,101,106,112,114,118,127,130,135,142,146,165,171,178,186,194,199],
    Nature: [3,10,17,18,25,26,33,40,48,55,68,75,85,92,96,108,111,119,128,136,147,152,158,166,172,179,195],
    Beast: [4,11,19,27,34,41,49,57,59,69,76,77,86,94,102,109,121,129,137,138,143,145,148,167,169,173,175],
    Material: [5,12,20,28,35,42,50,56,60,70,78,87,97,105,110,122,126,131,139,150,155,156,157,159,162,168,174,181,187],
    Demon: [6,13,21,29,36,43,51,61,62,64,71,79,88,93,95,98,103,113,123,132,140,149,153,160,163,180,182,185,192,193,196,197],
    Undead: [7,14,22,30,37,44,45,52,63,72,80,89,100,115,116,120,124,133,141,154,161,170,176,183,188,198],
  };
  return (genericFamilies[m.family] || familyGenerics[m.family] || []).includes(m.id) ||
    ['F','E','D','C','B','A'].includes(m.rank);
}

function renderComboParent(spec) {
  if (spec.startsWith('family:')) {
    const fam = spec.replace('family:','');
    return `<span class="badge fam-${fam}" style="padding:4px 10px;font-size:0.82rem">N'importe quel ${fam}</span>`;
  }
  const m = MONSTERS.find(x => x.name === spec);
  if (!m) return `<span>${spec}</span>`;
  return `<div class="combo-part" onclick="selectMonster('A',${m.id})">
    <div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;overflow:hidden">${spriteImg(m,22)}</div>
    <span style="font-weight:600">${m.name}</span>
  </div>`;
}

// ============================================================
// MONSTER LIST
// ============================================================
const FAMILIES = ['Slime','Dragon','Nature','Beast','Material','Demon','Undead','Incarni'];

function initList() {
  const bar = document.getElementById('familyFilters');
  bar.innerHTML = `<button class="filter-btn active" onclick="setFamilyFilter(null,this)">Tous</button>` +
    FAMILIES.map(f => `<button class="filter-btn" onclick="setFamilyFilter('${f}',this)">${f}</button>`).join('');
  renderList();
}

function setFamilyFilter(fam, btn) {
  listFamilyFilter = fam;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList() {
  const q = document.getElementById('listSearch').value.toLowerCase().trim();
  let filtered = MONSTERS;
  if (listFamilyFilter) filtered = filtered.filter(m => m.family === listFamilyFilter);
  if (q) filtered = filtered.filter(m => m.name.toLowerCase().includes(q));

  document.getElementById('monsterGrid').innerHTML = filtered.map(m => `
    <div class="monster-tile" onclick="goToMonster(${m.id})">
      <div class="sprite-box" style="width:54px;height:54px">${spriteImg(m,48)}</div>
      <span class="id">#${m.id}</span>
      <span class="name">${m.name}</span>
      <div class="badge-row">
        ${familyBadge(m.family)}
        ${rankBadge(m.rank)}
      </div>
    </div>
  `).join('');
}

function goToMonster(id) {
  selectedTarget = byId[id];
  document.getElementById('searchTarget').value = byId[id].name;
  switchTab('reverse');
  renderReverse();
}

// ============================================================
// TABS
// ============================================================
function switchTab(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  const tabs = ['fusion','reverse','list'];
  document.querySelectorAll('.tab')[tabs.indexOf(name)].classList.add('active');
}

// ============================================================
// INIT
// ============================================================
initList();
</script>
