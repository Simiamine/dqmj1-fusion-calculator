<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DQMJ1 — Calculateur de Fusion</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header>
  <div>
    <h1>⚔️ DQMJ1 Fusion Calculator</h1>
    <span>Dragon Quest Monsters: Joker — données GameFAQs / Wiki Dragon Quest</span>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('fusion')">Calculateur</div>
  <div class="tab" onclick="switchTab('reverse')">Recherche inverse</div>
  <div class="tab" onclick="switchTab('list')">Tous les monstres</div>
</div>

<!-- ========== FUSION ========== -->
<div id="fusion" class="page active">
  <div class="fusion-grid">
    <div class="parent-card">
      <h3>Parent A</h3>
      <div class="search-wrap">
        <input class="search-input" id="searchA" placeholder="Chercher un monstre…" autocomplete="off" />
        <div class="dropdown" id="dropA"></div>
      </div>
      <div class="monster-preview" id="previewA">
        <div class="sprite-box"><span class="no-sprite">?</span></div>
        <span class="monster-name" style="color:var(--text2)">Aucun monstre sélectionné</span>
      </div>
    </div>

    <div class="arrow-col">
      <button class="arrow-btn" id="fuseBtn" onclick="runFusion()" disabled>+</button>
    </div>

    <div class="parent-card">
      <h3>Parent B</h3>
      <div class="search-wrap">
        <input class="search-input" id="searchB" placeholder="Chercher un monstre…" autocomplete="off" />
        <div class="dropdown" id="dropB"></div>
      </div>
      <div class="monster-preview" id="previewB">
        <div class="sprite-box"><span class="no-sprite">?</span></div>
        <span class="monster-name" style="color:var(--text2)">Aucun monstre sélectionné</span>
      </div>
    </div>
  </div>

  <div class="result-section" id="fusionResult"></div>
</div>

<!-- ========== REVERSE ========== -->
<div id="reverse" class="page">
  <div class="reverse-input-wrap">
    <h3>Monstre cible</h3>
    <div class="search-wrap">
      <input class="search-input" id="searchT" placeholder="Quel monstre veux-tu obtenir ?" autocomplete="off" />
      <div class="dropdown" id="dropT"></div>
    </div>
  </div>

  <div id="reverseResult"></div>

  <div class="tree-section" id="treeSection" style="display:none">
    <p class="result-title" style="margin-bottom:12px">🌳 Arbre de fusion complet</p>
    <div id="treeContainer"></div>
  </div>
</div>

<!-- ========== LIST ========== -->
<div id="list" class="page">
  <input class="search-bar-full" id="listSearch" placeholder="Filtrer par nom français ou anglais…" oninput="renderList()" />
  <div class="filter-bar" id="familyFilters"></div>
  <div class="monster-grid" id="monsterGrid"></div>
</div>

<script src="js/ui.js"></script>
<script src="js/fusion.js"></script>
<script src="js/tree.js"></script>
<script src="js/app.js"></script>

<script>
  // Patch pour afficher la section arbre quand un monstre est sélectionné
  const _origRenderTree = renderTree;
  function renderTree(containerId, monster, monsters, recipes) {
    _origRenderTree(containerId, monster, monsters, recipes);
    document.getElementById('treeSection').style.display = 'block';
  }
</script>

</body>
</html>
